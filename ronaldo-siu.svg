<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Ronaldo doing the Siu celebration over the number 985">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d2b1a"/>
      <stop offset="55%" stop-color="#06170e"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f9e5f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f9e5f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <ellipse cx="600" cy="330" rx="430" ry="270" fill="url(#glow)"/>

  <!-- ghost number behind him -->
  <text x="600" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="380" fill="none" stroke="#2e7d4f" stroke-opacity="0.4" stroke-width="2">985</text>

  <!-- crown over the 9 -->
  <path d="M296 168 L314 132 L338 158 L360 124 L382 158 L406 132 L424 168 Z" fill="none" stroke="#c9a227" stroke-width="5" stroke-linejoin="round"/>

  <!-- ground shadow, breathes with the jump -->
  <ellipse cx="600" cy="552" rx="150" ry="15" fill="#000000" opacity="0.5" filter="url(#soft)">
    <animate attributeName="rx" values="150;128;150" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.34;0.5" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ronaldo, back view, mid Siu -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>

    <!-- left arm: red sleeve, skin forearm, spread down and out -->
    <polygon points="556,192 528,182 498,238 524,252" fill="#d21f2c"/>
    <polygon points="524,252 498,238 458,292 476,308" fill="#c68863"/>
    <circle cx="468" cy="302" r="11" fill="#c68863"/>
    <!-- captain armband -->
    <polygon points="538,194 510,220 521,235 549,209" fill="#f2f2f2"/>

    <!-- right arm -->
    <polygon points="644,192 672,182 702,238 676,252" fill="#d21f2c"/>
    <polygon points="676,252 702,238 742,292 724,308" fill="#c68863"/>
    <circle cx="732" cy="302" r="11" fill="#c68863"/>

    <!-- legs, wide mid jump: skin thighs, red socks, white boots -->
    <polygon points="572,344 600,344 556,428 528,416" fill="#c68863"/>
    <polygon points="556,428 528,416 492,502 518,512" fill="#d21f2c"/>
    <polygon points="492,502 522,512 524,528 478,524 484,506" fill="#f5f0f0"/>
    <polygon points="628,344 600,344 644,428 672,416" fill="#c68863"/>
    <polygon points="644,428 672,416 708,502 682,512" fill="#d21f2c"/>
    <polygon points="708,502 678,512 676,528 722,524 716,506" fill="#f5f0f0"/>

    <!-- torso, Portugal red -->
    <path d="M552 184 L648 184 L636 306 L564 306 Z" fill="#d21f2c"/>
    <text x="600" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#ffffff">RONALDO</text>
    <text x="600" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="62" fill="#ffffff">7</text>

    <!-- shorts -->
    <path d="M564 302 L636 302 L650 356 L606 356 L600 342 L594 356 L550 356 Z" fill="#b81a26"/>

    <!-- head and hair -->
    <circle cx="600" cy="150" r="27" fill="#c68863"/>
    <path d="M573 150 A27 27 0 0 1 627 150 Z" fill="#17100d"/>
    <rect x="588" y="168" width="24" height="18" fill="#c68863"/>
  </g>

  <!-- ground light line -->
  <rect x="180" y="566" width="840" height="2" fill="#2f9e5f" opacity="0.55"/>

  <text x="600" y="622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="42" letter-spacing="16" fill="#eaf7ee">SIUUU</text>
  <text x="600" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="6" fill="#7fae8d">GREATNESS IS EARNED</text>
</svg>
